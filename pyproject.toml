[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thinkingbox"
version = "0.1.0"
description = "A self-contained agent that thinks inside the box"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]",
    "fastmcp",
    "httpx",
    "pydantic",
    "pydantic[email]",
    "pyyaml",
    "prompt_toolkit",
    "uvicorn",
    "scipy",
    "starlette",
    "numpy",
    "typesense",
    "requests",
    "rich",
    "azure-identity",
    "click",
    "python-dateutil",
]

[project.scripts]
tb = "thinkingbox.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["thinkingbox*"]

[tool.setuptools.package-data]
"thinkingbox.common" = ["data/*.yaml"]

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | __pycache__
)/
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true


[tool.pytest.ini_options]
markers = [
    "typesense: tests that require a running typesense server",
]

[dependency-groups]
dev = [
    "pre-commit>=4.3.0",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.1.0",
    "black",
    "isort",
    "flake8",
]

# duplicate for pip compatibility
[project.optional-dependencies]
dev = [
    "pre-commit>=4.3.0",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.1.0",
    "black",
    "isort",
    "flake8",
]
