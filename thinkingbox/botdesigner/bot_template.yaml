      action:
        kind: "InvokeConnectorTaskAction"
        connectionReference: {"~format": "thinkingbox_poc.shared_thinkingbox_connector.connection{connector[index]:03d}"}
        connectionProperties:
          mode: "Maker"

        operationId: {"~value": "connector[name]"}

      outputMode: "All"

  - "~unpack": "connector : mcp_connectors"
