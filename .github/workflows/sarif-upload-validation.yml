name: Validate SARIF upload permissions

on:
  push:
    branches: [ltsai-microsoft-fix-scorecard-github-token]

permissions: read-all

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read

    steps:
      - name: Create empty SARIF report
        run: |
          printf '%s\n' \
            '{"version":"2.1.0","runs":[{"tool":{"driver":{"name":"Scorecard upload validation","rules":[]}},"results":[]}]}' \
            > results.sarif

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
