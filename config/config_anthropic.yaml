mcp_proxy:
  endpoint_url: "http://127.0.0.1:7111"
  timeout: 300.0

orchestrator:
  type: thinkingbox
  agent_model:
    type: anthropic
    deployment: "claude-sonnet-4-6"
    endpoint_url: "<YOUR_ANTHROPIC_ENDPOINT_URL>"
    credential:
      type: azure-identity
      name: CertificateCredential
      scope: "api://<YOUR_APP_ID>/.default"
      certificate_path: "<PATH_TO_YOUR_CERTIFICATE.pfx>"
      client_id: "<YOUR_CLIENT_ID>"
      tenant_id: "<YOUR_TENANT_ID>"
      send_certificate_chain: true
      validate_certificate_chain: true
    headers:
      X-ms-Source: '{"consumptionSource":"Api","partnerSource":"Example.Planner"}'
      x-ms-client-principal-id: "00000000-0000-0000-0000-000000000000"
      x-ms-client-tenant-id: "<YOUR_TENANT_ID>"
      anthropic-beta: interleaved-thinking-2025-05-14
    thinking:
      type: enabled
      budget_tokens: 10000
    temperature: 1.0
    max_completion_tokens: 16384
    timeout: 600.0

judge_model:
  type: aoai
  credential: az-cli
  account_name: "<YOUR_AOAI_ACCOUNT>"
  deployment: "<YOUR_JUDGE_DEPLOYMENT>"
  temperature: 0.0
  seed: 42
  max_completion_tokens: 128
  api_version: "2025-04-01-preview"
  timeout: 600.0

user_model:
  type: aoai
  credential: az-cli
  account_name: "<YOUR_AOAI_ACCOUNT>"
  deployment: "<YOUR_USER_DEPLOYMENT>"
  temperature: 0.0
  max_completion_tokens: 4096
  api_version: "2025-04-01-preview"
  timeout: 600.0
